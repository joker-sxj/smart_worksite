name: deploy

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-30}"

services:
  mysql:
    logging: *default-logging
    image: mysql:${MYSQL_VERSION:-8.4}
    container_name: smart-worksite-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_worksite}
      MYSQL_USER: ${MYSQL_USER:-worksite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-worksite}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    logging: *default-logging
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: smart-worksite-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    logging: *default-logging
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    container_name: smart-worksite-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    logging: *default-logging
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-04-16T18-13-26Z}
    container_name: smart-worksite-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-smart-worksite}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      "
    restart: "no"

  python-ai-service:
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile.python-ai-service
    container_name: smart-worksite-python-ai-service
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8015
      AI_SERVICE_API_KEY: ${AI_PYTHON_API_KEY:-dev-ai-service-key}
      AI_ACCESS_LOG: ${AI_ACCESS_LOG:-false}
      AI_DEPLOYMENT_MODE: ${AI_DEPLOYMENT_MODE:-LOCAL_ONLY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://local-llm:8000/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-smart-worksite-chat}
      QWEN_VL_ENDPOINT: ${QWEN_VL_CONTAINER_ENDPOINT:-http://local-llm:8000/v1/chat/completions}
      QWEN_VL_API_KEY: ${QWEN_VL_API_KEY:-}
      QWEN_VL_MODEL: ${QWEN_VL_MODEL:-smart-worksite-chat}
      QWEN_EMBEDDING_BASE_URL: ${QWEN_EMBEDDING_BASE_URL:-http://local-embedding:8000/v1}
      QWEN_EMBEDDING_MODEL: ${QWEN_EMBEDDING_MODEL:-smart-worksite-embedding}
      QWEN_EMBEDDING_DIMENSIONS: ${QWEN_EMBEDDING_DIMENSIONS:-0}
      QWEN_RERANK_BASE_URL: ${QWEN_RERANK_BASE_URL:-http://local-reranker:8081/v1/rerank}
      QWEN_RERANK_MODEL: ${QWEN_RERANK_MODEL:-smart-worksite-reranker}
      QWEN_RERANK_API_STYLE: ${QWEN_RERANK_API_STYLE:-QWEN3}
      RAG_PROVIDER: ${RAG_PROVIDER:-LOCAL}
      RAG_DATA_DIR: /app/data/rag
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      PGVECTOR_DSN: ${PGVECTOR_DSN:-}
    ports:
      - "${AI_SERVICE_PORT:-8015}:8015"
    volumes:
      - ../python-ai-service/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8015/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  pgvector:
    logging: *default-logging
    image: pgvector/pgvector:${PGVECTOR_VERSION:-pg16}
    container_name: smart-worksite-pgvector
    restart: unless-stopped
    profiles: ["vector"]
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:-smart_worksite_vector}
      POSTGRES_USER: ${PGVECTOR_USER:-worksite}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-worksite}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PGVECTOR_PORT:-15432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus-etcd:
    logging: *default-logging
    image: quay.io/coreos/etcd:${MILVUS_ETCD_VERSION:-v3.5.18}
    container_name: smart-worksite-milvus-etcd
    profiles: ["vector"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd

  milvus-minio:
    logging: *default-logging
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    container_name: smart-worksite-milvus-minio
    profiles: ["vector"]
    environment:
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MILVUS_MINIO_PORT:-19002}:9000"
    command: minio server /minio_data
    volumes:
      - milvus-minio-data:/minio_data

  milvus:
    logging: *default-logging
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.5.4}
    container_name: smart-worksite-milvus
    restart: unless-stopped
    profiles: ["vector"]
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-19091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - milvus-etcd
      - milvus-minio

volumes:
  mysql-data:
  redis-data:
  minio-data:
  pgvector-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
