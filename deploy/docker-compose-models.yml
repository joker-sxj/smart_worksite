x-model-logging: &model-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-30}"

services:
  local-llm:
    image: ${VLLM_IMAGE:?VLLM_IMAGE is required}
    container_name: smart-worksite-local-llm
    ipc: host
    restart: unless-stopped
    logging: *model-logging
    environment:
      CUDA_VISIBLE_DEVICES: ${CHAT_CUDA_VISIBLE_DEVICES:-0}
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      VLLM_ENABLE_CUDA_COMPATIBILITY: ${VLLM_ENABLE_CUDA_COMPATIBILITY:-1}
    command:
      - --model
      - ${CHAT_MODEL_ID:?CHAT_MODEL_ID is required}
      - --revision
      - ${CHAT_MODEL_REVISION:?CHAT_MODEL_REVISION is required}
      - --served-model-name
      - ${CHAT_MODEL_NAME:-smart-worksite-chat}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "${CHAT_TENSOR_PARALLEL_SIZE:-1}"
      - --max-model-len
      - "${CHAT_MAX_MODEL_LEN:-16384}"
      - --max-num-seqs
      - "${CHAT_MAX_NUM_SEQS:-2}"
      - --gpu-memory-utilization
      - "${CHAT_GPU_MEMORY_UTILIZATION:-0.90}"
      - --trust-remote-code
    ports:
      - "127.0.0.1:${CHAT_HOST_PORT:-18000}:8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  local-embedding:
    image: ${VLLM_IMAGE:?VLLM_IMAGE is required}
    container_name: smart-worksite-local-embedding
    ipc: host
    restart: unless-stopped
    logging: *model-logging
    environment:
      CUDA_VISIBLE_DEVICES: ${EMBEDDING_CUDA_VISIBLE_DEVICES:-0}
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      VLLM_ENABLE_CUDA_COMPATIBILITY: ${VLLM_ENABLE_CUDA_COMPATIBILITY:-1}
    command:
      - --model
      - ${EMBEDDING_MODEL_ID:?EMBEDDING_MODEL_ID is required}
      - --revision
      - ${EMBEDDING_MODEL_REVISION:?EMBEDDING_MODEL_REVISION is required}
      - --served-model-name
      - ${EMBEDDING_MODEL_NAME:-smart-worksite-embedding}
      - --task
      - embed
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${EMBEDDING_MAX_MODEL_LEN:-8192}"
      - --max-num-seqs
      - "${EMBEDDING_MAX_NUM_SEQS:-4}"
      - --gpu-memory-utilization
      - "${EMBEDDING_GPU_MEMORY_UTILIZATION:-0.15}"
      - --trust-remote-code
    ports:
      - "127.0.0.1:${EMBEDDING_HOST_PORT:-18001}:8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  local-reranker:
    image: ${VLLM_IMAGE:?VLLM_IMAGE is required}
    container_name: smart-worksite-local-reranker
    ipc: host
    restart: unless-stopped
    logging: *model-logging
    environment:
      CUDA_VISIBLE_DEVICES: ${RERANK_CUDA_VISIBLE_DEVICES:-0}
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
      VLLM_ENABLE_CUDA_COMPATIBILITY: ${VLLM_ENABLE_CUDA_COMPATIBILITY:-1}
    command:
      - --model
      - ${RERANK_MODEL_ID:?RERANK_MODEL_ID is required}
      - --revision
      - ${RERANK_MODEL_REVISION:?RERANK_MODEL_REVISION is required}
      - --served-model-name
      - ${RERANK_MODEL_NAME:-smart-worksite-reranker}
      - --runner
      - pooling
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${RERANK_MAX_MODEL_LEN:-4096}"
      - --max-num-seqs
      - "${RERANK_MAX_NUM_SEQS:-8}"
      - --gpu-memory-utilization
      - "${RERANK_GPU_MEMORY_UTILIZATION:-0.10}"
      - --trust-remote-code
      - --hf-overrides
      - ${RERANK_HF_OVERRIDES:?RERANK_HF_OVERRIDES is required}
    ports:
      - "127.0.0.1:${RERANK_HOST_PORT:-18002}:8000"
    volumes:
      - model-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  model-cache:
    name: ${MODEL_CACHE_VOLUME:-smart-worksite-model-cache}
